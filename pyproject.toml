[build-system]
requires = ["setuptools>=70", "wheel", "packaging>=24.2"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-llm-serving"
version = "0.1.0"
description = "Learning-first vLLM inference benchmarking and observability project"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "prometheus-client>=0.20",
  "PyYAML>=6.0",
  "pandas>=2.2",
  "matplotlib>=3.9",
  "numpy>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "mypy>=1.11",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "benchmark*"]
exclude = ["configs*", "monitoring*", "results*", "scripts*", "tests*", "docs*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100